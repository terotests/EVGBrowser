<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>React-testi – EVG Browser</title>
<link rel="stylesheet" href="../uutiset.css">
<style>
  .todo { max-width: 640px; margin: 24px auto; padding: 0 16px; }
  .todo h1 { font-size: 28px; margin-bottom: 4px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 12px 0; }
  .item { padding: 10px 12px; border-radius: 8px; background: #f2f4f8; margin: 6px 0; display: flex; justify-content: space-between; }
  .item.done { background: #dff3e4; color: #46624d; }
  .count { color: #5a6577; font-size: 14px; }
  .chip { padding: 6px 12px; border-radius: 14px; background: #e3e8f2; }
  .chip.on { background: #3d5192; color: #ffffff; }
</style>
<script src="react.production.min.js"></script>
<script src="react-dom.production.min.js"></script>
</head>
<body>
<div id="root"><noscript><p>Tämä sivu on React-sovellus: se näkyy, kun skriptit ovat käytössä.</p></noscript></div>
<script src="app.js"></script>
</body>
</html>
