# Builds the browser-in-browser demo and publishes it on GitHub Pages.
# Repository settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the Ranger compiler (npm) and the Ranger packages in ranger.lock
      - run: npm ci
      - name: Headless checks (JavaScript)
        run: node tools/check.mjs
      - name: Headless checks (C++)
        run: node tools/check.mjs --cpp
      - name: Build the page
        run: node web/build.mjs --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
